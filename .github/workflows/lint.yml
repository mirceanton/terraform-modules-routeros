---
name: Lint

on:
  push: {}

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run actionlint
        run: actionlint

  discover:
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover modules
        id: scan
        uses: mirceanton/action-folder-matrix@c902e00d24321cda4a1513d4de8380b827a9ef8d # v3.0.9
        with:
          path: "./modules"
          changed-only: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tofu-validate:
    name: "Validate (${{ matrix.directory }})"
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).directory[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Init
        working-directory: modules/${{ matrix.directory }}
        run: tofu init -upgrade

      - name: Validate
        working-directory: modules/${{ matrix.directory }}
        run: tofu validate

  tofu-fmt:
    name: "Format Check (${{ matrix.directory }})"
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).directory[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Check formatting
        working-directory: modules/${{ matrix.directory }}
        run: tofu fmt -check

  docs-check:
    name: "Docs Check (${{ matrix.directory }})"
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).directory[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Check terraform-docs
        working-directory: modules/${{ matrix.directory }}
        run: |
          terraform-docs .
          git diff --exit-code README.md
